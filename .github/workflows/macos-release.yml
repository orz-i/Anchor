name: macOS CLI Manual Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：上传 CLI 到已存在的 Release，例如 v0.1.23"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/anchor
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 检查前端
        run: pnpm check
      - name: 构建 macOS CLI
        run: pnpm release:build
      - name: 准备 CLI 产物
        run: mkdir -p dist && cp crates/anchor/target/release/anchor dist/anchor-macos
      - name: 上传 CLI 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: anchor-${{ github.ref_name }}-macos
          path: dist/anchor-macos
          if-no-files-found: error

  upload-release:
    if: ${{ inputs.release_tag != '' }}
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 macOS CLI
        uses: actions/download-artifact@v4
        with:
          name: anchor-${{ github.ref_name }}-macos
          path: dist/macos
      - name: 上传 CLI 到指定 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release upload "$RELEASE_TAG" dist/macos/anchor-macos
          --repo "$GITHUB_REPOSITORY"
          --clobber
