name: CLI Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要创建或更新的 Release 标签，例如 v0.1.22"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: anchor-linux
            binary: crates/anchor/target/release/anchor
          - os: windows-latest
            artifact: anchor-windows.exe
            binary: crates/anchor/target/release/anchor.exe
          - os: macos-latest
            artifact: anchor-macos
            binary: crates/anchor/target/release/anchor
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/anchor
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm release:build
      - name: 准备 CLI 产物
        run: >-
          node -e "const fs=require('fs');fs.mkdirSync('dist',{recursive:true});fs.copyFileSync(process.argv[1],process.argv[2])"
          "${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
      - name: 上传 CLI 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载 CLI 产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 创建 Release 并上传 CLI
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Anchor ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
