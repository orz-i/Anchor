name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/anchor
      - name: rustfmt
        run: cargo fmt --manifest-path crates/anchor/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path crates/anchor/Cargo.toml --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --manifest-path crates/anchor/Cargo.toml --all-features -- --test-threads=1
