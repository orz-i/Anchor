[package]
name = "anchor"
version = "0.1.23"
description = "Anchor CLI and Web Admin workspace gateway"
authors = ["Anchor Contributors"]
edition = "2021"
autobins = false

[features]
default = ["cli"]
cli = ["tokio/signal"]

[[bin]]
name = "anchor"
path = "src/bin/anchor.rs"
required-features = ["cli"]

[lib]
name = "anchor_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "process", "io-util", "fs", "time"] }
axum = { version = "0.8", features = ["form"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
jsonschema = { version = "0.48", default-features = false }
walkdir = "2"
regex = "1"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.3"
jsonwebtoken = "9"
sha2 = "0.10"
shlex = "1"
shell-words = "1"
which = "7"
zip = "2"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
